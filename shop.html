<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — ROADKILL</title>
  <meta name="description" content="Shop the ROADKILL drop. Damaged on purpose. Beanies built for the PA winter.">

  <!-- Open Graph -->
  <meta property="og:title" content="Shop — ROADKILL">
  <meta property="og:description" content="Shop the ROADKILL drop. Damaged on purpose.">
  <meta property="og:image" content="/assets/og-banner.jpg">
  <meta property="og:url" content="https://www.roadkillbrand.com/shop.html">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230d0d0d'/><text y='24' font-size='20' font-weight='700' fill='%23f2c200'>!</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="masthead">
  <div class="container masthead__inner">
    <a href="index.html" class="logo" aria-label="ROADKILL home">
      <span class="logo__word">ROADKILL</span>
      <span class="logo__variant">ROADK!LL</span>
    </a>
    <nav class="nav" id="nav">
      <a href="index.html" class="nav__link">Home</a>
      <a href="shop.html" class="nav__link">Shop</a>
      <a href="about.html" class="nav__link">About</a>
      <a href="faq.html" class="nav__link">FAQ</a>
      <a href="cart.html" class="nav__cart" aria-label="Open cart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f2c200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="nav__cart-count" id="navCartCount">0</span>
      </a>
    </nav>
    <button class="nav__toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<div class="page" id="page">
  <section class="page-section shop">
    <div class="container">
      <div class="shop__hero">
        <h1 class="shop__title">Shop the Drop</h1>
        <p class="shop__sub">The first drop &mdash; beanie-first. All pieces are damaged on purpose.</p>
        <div class="shop__countdown" id="shopCountdown"></div>
      </div>

      <div class="shop__filter-bar">
        <select id="colorFilter" class="input" aria-label="Filter by color">
          <option value="All">All colors</option>
        </select>
        <select id="categoryFilter" class="input" aria-label="Filter by category">
          <option value="All">All categories</option>
        </select>
        <span id="shopStatus" class="shop__status"></span>
      </div>

      <div class="product-grid" id="shopGrid">
        <!-- Populated by app.js -->
      </div>

      <div class="shop__empty" id="shopEmpty">
        <p>Nothing here yet.</p>
        <a href="index.html" class="btn btn--ghost">Start shopping</a>
      </div>
    </div>
  </section>
</div>

<div class="cart-overlay" id="cartOverlay" aria-hidden="true"></div>
<div class="cart-drawer" id="cartDrawer" aria-hidden="true" role="dialog" aria-label="Shopping cart">
  <div class="cart-drawer__header">
    <h2>Your Cart</h2>
    <button class="cart-drawer__close" id="cartClose" aria-label="Close cart">&times;</button>
  </div>
  <ul class="cart-drawer__list" id="cartList"></ul>
  <div class="cart-drawer__footer">
    <div class="cart-drawer__totals">
      <span class="cart-drawer__subtotal">Subtotal</span>
      <span class="cart-drawer__amount" id="cartSubtotal">$0.00</span>
    </div>
    <a href="checkout.html" class="btn btn--primary btn--full">Checkout</a>
    <p class="cart-drawer__note">Stripe-ready &middot; placeholder until you plug in your key.</p>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
